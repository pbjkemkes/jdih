<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">

<title>Daftar Pengguna</title>

<link rel="stylesheet"
href="css/stael-login.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>

</head>

<body>

<div class="login-box">

<h2>Daftar Pengguna Baru</h2>

<form id="registerForm">

<input
id="nama"
placeholder="Nama Lengkap"
required>

<input
id="email"
type="email"
placeholder="Email @kemkes.go.id"
required>

<input
id="password"
type="password"
placeholder="Password"
required>

<input
id="password2"
type="password"
placeholder="Konfirmasi Password"
required>

<button type="submit">
Daftar
</button>

</form>

<br>

<a href="masuk.html">
Kembali ke Login
</a>

</div>

<script src="js/daftar.js"></script>

</body>

</html>
